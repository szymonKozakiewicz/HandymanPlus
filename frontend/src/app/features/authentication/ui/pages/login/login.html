<login-register-frame 
mainActionButtonText="Login" 
switchModeButtonText="Register"
(switchModeButtonClicked)="onSwitchToRegisterPageButtonClicked()"
(mainActionButtonClicked)="onLoginButtonClicked()">
        <mat-form-field class="w-full mb-1">
            <mat-label>Login</mat-label>
            <input  matInput [formField]="loginForm.login">
            <mat-error>{{loginErrorMessage()}}</mat-error>
        </mat-form-field>

        <mat-form-field class="w-full mb-1">
            <mat-label>Password</mat-label>
            <input type="password" matInput [formField]="loginForm.password">
            <mat-error>{{passwordErrorMessage()}}</mat-error>
        </mat-form-field>
</login-register-frame>
